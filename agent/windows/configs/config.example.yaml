# TUF Remote agent — example configuration.
#
# Copy to configs/config.yaml (the default probe path) or pass explicitly:
#   tuf-remote-agent.exe -config path\to\config.yaml
#
# Every value below can be overridden by an environment variable with the
# TUF_REMOTE_ prefix and the path in upper snake case, e.g.
#   TUF_REMOTE_SERVER_PORT=9000
#   TUF_REMOTE_DATABASE_PATH=C:\ProgramData\TUFRemote\agent.db
#   TUF_REMOTE_LOGGING_LEVEL=debug
# Empty environment variables are ignored.

agent:
  # Friendly name shown to paired Android devices (max 64 characters).
  name: "TUF Remote"

server:
  # Bind address. 127.0.0.1 keeps the agent local-only (default).
  # Use 0.0.0.0 to expose it on the local network — TLS is then required
  # before the deployment may be considered production-ready.
  host: "127.0.0.1"
  # TCP port. 0 asks the operating system for an ephemeral port (tests).
  port: 8765
  # HTTP timeouts (Go duration strings: "5s", "1m30s", ...).
  read_header_timeout: "5s"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "60s"
  # Upper bound for ordinary request bodies (bytes).
  max_request_bytes: 1048576
  tls:
    # LAN deployments must enable TLS. Certificates must be provisioned
    # beforehand (self-signed works for a private LAN once the device
    # trusts it).
    enabled: false
    cert_file: ""   # PEM certificate (leaf or full chain)
    key_file: ""    # PEM private key

database:
  # SQLite file; parent directories are created automatically.
  path: "data/tuf_remote.db"
  # How long SQLite waits for a locked database before failing.
  busy_timeout: "5s"

logging:
  # One of: debug, info, warn, error
  level: "info"
  # One of: text, json
  format: "text"

security:
  pairing:
    # How long an opened pairing session stays valid (1m30s style strings).
    # The PIN is shown on the PC only while this window is open.
    pin_ttl: "5m"
    # Wrong PINs a session tolerates before it is burned.
    max_attempts: 5
    # Concurrently open pairing sessions (1-20).
    max_active_sessions: 3
    # How long a rotated token stays valid so in-flight requests do not fail.
    token_grace_period: "30s"
  rate_limit:
    # POST /api/v1/pairing/confirm attempts allowed per client IP per
    # minute. The PIN itself is additionally limited by max_attempts.
    confirm_per_minute: 20
  # Extra hostnames the agent answers for, beyond IP literals, localhost
  # and this machine's hostname. Only needed if you reach the PC by a name
  # (for example an mDNS name such as "my-pc.local").
  # This is the DNS rebinding defence: requests addressed to any other
  # name are refused.
  allowed_hosts: []
